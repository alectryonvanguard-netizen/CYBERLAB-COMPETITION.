name: Compile .engine Production Package

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    name: Build .engine Native Android Package
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository workspace source
        uses: actions/checkout@v4

      - name: Initialize Java Infrastructure Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize Android SDK Environment
        uses: android-actions/setup-android@v4

      - name: Install Low-Level C/C++ Compiler Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential wget
          python3 -m pip install --upgrade pip
          python3 -m pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv

      # FIXED: Points to the authentic Google repository binary path
      - name: Pre-Download and Inject Stable Android NDK r25b
        run: |
          mkdir -p ~/.buildozer/android/platform/
          wget -q https://google.com -O ~/android-ndk-r25b-linux.zip
          unzip -q ~/android-ndk-r25b-linux.zip -d ~/.buildozer/android/platform/
          rm ~/android-ndk-r25b-linux.zip

      - name: Execute Native Android Architecture Compilation
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer android debug
          
      - name: Export Master Production APK Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-production-binary
          path: bin/*.apk
          if-no-files-found: error
