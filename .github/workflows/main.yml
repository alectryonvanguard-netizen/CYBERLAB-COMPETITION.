name: Compile .engine Production Package

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    name: Build .engine Native Android Package
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository workspace source
        uses: actions/checkout@v4

      - name: Free Disk Space for NDK Compilation
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

      - name: Initialize Java Infrastructure Environment
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize Android SDK Environment
        uses: android-actions/setup-android@v4

      # Licenses first, then install components
      - name: Pre-Install Android SDK & Toolchain Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
          ls $ANDROID_HOME/ndk

      # Make buildozer.spec match what was actually installed above
      - name: Point buildozer at the installed SDK/NDK
        run: |
          sed -i "s|^android.sdk_path.*|android.sdk_path = $ANDROID_HOME|" buildozer.spec
          sed -i "s|^android.ndk_path.*|android.ndk_path = $ANDROID_HOME/ndk/25.2.9519653|" buildozer.spec
          sed -i "s|^p4a.branch.*|p4a.branch = v2024.01.21|" buildozer.spec
          grep -q "^android.accept_sdk_license" buildozer.spec || sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec
          grep -E "sdk_path|ndk_path|p4a|accept_sdk" buildozer.spec

      # buildozer 1.5.0 looks for sdkmanager at the legacy tools/bin path
      - name: Link sdkmanager to the legacy path buildozer expects
        run: |
          mkdir -p $ANDROID_HOME/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
          ls -l $ANDROID_HOME/tools/bin/

      - name: Install Low-Level C/C++ Compiler Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential
          python3 -m pip install --upgrade pip
          python3 -m pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv

      # Restore compiler cache architecture
      - name: Restore Compiler Cache Architecture
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-build-cache-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-

      # Build-time guard: the app imports engine_core.py, so it must be in the repo
      - name: Check required source files
        run: |
          for f in main.py engine_core.py engine_infra.py engine_admin.py buildozer.spec; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f in the repository root. Upload it and run again."
              exit 1
            fi
          done

      # Replaces the default Kivy loading screen with a branded one
      - name: Prepare launch screen
        run: |
          python3 -m pip install pillow
          python3 - <<'EOF'
          import os
          from PIL import Image, ImageDraw, ImageFont

          if os.path.exists("presplash.png"):
              print("presplash.png already present")
              raise SystemExit

          S = 1024
          bg, accent, muted = (5, 8, 15), (0, 240, 255), (95, 122, 148)
          img = Image.new("RGB", (S, S), bg)
          d = ImageDraw.Draw(img)

          for p in range(0, S, 48):
              d.line([(p, 0), (p, S)], fill=(8, 22, 32))
              d.line([(0, p), (S, p)], fill=(8, 22, 32))

          def font(size):
              for path in ("/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf",
                           "/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf"):
                  if os.path.exists(path):
                      return ImageFont.truetype(path, size)
              return ImageFont.load_default(size)

          def centered(text, y, fnt, fill):
              w = d.textlength(text, font=fnt)
              d.text(((S - w) / 2, y), text, font=fnt, fill=fill)

          centered("> .engine", 400, font(150), accent)
          centered("DOMAIN HOSTING CONSOLE", 600, font(34), muted)
          d.rectangle([312, 680, 712, 686], fill=(10, 40, 52))
          d.rectangle([312, 680, 512, 686], fill=accent)
          img.save("presplash.png", optimize=True)
          print("generated presplash.png")
          EOF
          python3 - <<'EOF'
          import re
          p = "buildozer.spec"
          s = open(p).read()
          def setkey(key, val):
              global s
              pat = r"^" + re.escape(key) + r"\s*=.*$"
              if re.search(pat, s, re.M):
                  s = re.sub(pat, key + " = " + val, s, flags=re.M)
              else:
                  s = re.sub(r"^\[app\]\s*$", "[app]\n" + key + " = " + val, s, count=1, flags=re.M)
          setkey("presplash.filename", "presplash.png")
          setkey("android.presplash_color", "#05080F")
          open(p, "w").write(s)
          EOF
          grep -n "presplash" buildozer.spec

      # The phone app is a small companion: it only needs the network
      - name: Configure app packaging
        run: |
          python3 - <<'EOF'
          import re
          p = "buildozer.spec"
          s = open(p).read()
          def setkey(key, val):
              global s
              pat = r"^" + re.escape(key) + r"\s*=.*$"
              if re.search(pat, s, re.M):
                  s = re.sub(pat, key + " = " + val, s, flags=re.M)
              else:
                  s = re.sub(r"^\[app\]\s*$", "[app]\n" + key + " = " + val, s, count=1, flags=re.M)
          setkey("requirements", "python3,kivy,pyjnius")
          setkey("android.permissions", "INTERNET, ACCESS_NETWORK_STATE")
          s = re.sub(r"^services\s*=.*\n", "", s, flags=re.M)
          open(p, "w").write(s)
          EOF
          grep -n -E "^(requirements|services|android.permissions)" buildozer.spec || true

      # buildozer.spec points at icon.png; create a placeholder if the repo has none
      - name: Ensure icon.png exists
        run: |
          python3 - <<'EOF'
          import os, zlib, struct
          if not os.path.exists("icon.png"):
              S = 512
              bg = (10, 14, 26)
              fg = (34, 211, 238)
              mid = S / 2
              rows = []
              for y in range(S):
                  row = bytearray([0])
                  for x in range(S):
                      dist = ((x - mid) ** 2 + (y - mid) ** 2) ** 0.5
                      row += bytes(fg if 120 <= dist <= 190 else bg)
                  rows.append(bytes(row))
              raw = b"".join(rows)
              def chunk(tag, data):
                  body = struct.pack(">I", len(data)) + tag + data
                  return body + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              png = (b"\x89PNG\r\n\x1a\n"
                     + chunk(b"IHDR", struct.pack(">IIBBBBB", S, S, 8, 2, 0, 0, 0))
                     + chunk(b"IDAT", zlib.compress(raw, 9))
                     + chunk(b"IEND", b""))
              open("icon.png", "wb").write(png)
              print("generated placeholder icon.png")
          else:
              print("icon.png already present")
          EOF

      # Fails fast (seconds, not 8 minutes) and shows file + line as an annotation
      - name: Syntax check Python sources
        run: |
          python3 - <<'EOF'
          import ast, glob, sys
          bad = False
          for f in glob.glob('**/*.py', recursive=True):
              if f.startswith(('.buildozer', 'bin')):
                  continue
              try:
                  ast.parse(open(f, encoding='utf-8').read(), f)
              except SyntaxError as e:
                  ln = e.lineno or 1
                  print(f"::error file={f},line={ln}::{e.msg}")
                  print(f"SYNTAX ERROR in {f} at line {ln}: {e.msg}")
                  src = open(f, encoding='utf-8').read().splitlines()
                  for n in range(max(0, ln - 15), min(len(src), ln + 2)):
                      print(f"{n + 1:5}: {src[n]}")
                  bad = True
          sys.exit(1 if bad else 0)
          EOF

      - name: Execute Native Android Architecture Compilation
        shell: bash
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show error tail
        if: failure()
        run: |
          if [ -f build.log ]; then tail -n 100 build.log; else echo "No build.log (failed before the build step)"; fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Export Master Production APK Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-production-binary
          path: bin/*.apk
          if-no-files-found: error
