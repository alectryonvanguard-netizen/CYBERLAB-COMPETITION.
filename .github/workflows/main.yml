name: Compile .engine Production Package

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    name: Build .engine Native Android Package
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository workspace source
        uses: actions/checkout@v4

      - name: Initialize Java Infrastructure Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Auto-provisions matching stable SDK environment components (Android API 33)
      - name: Initialize Android SDK Environment
        uses: android-actions/setup-android@v4

      - name: Install Low-Level C/C++ Compiler Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential
          python3 -m pip install --upgrade pip
          python3 -m pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv

      - name: Restore Compiler Cache Architecture
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-build-cache-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-

      # MATCHED COMPLIANCE LAYERS: Pre-authorises official Android SDK and NDK toolchain agreements
      - name: Pre-Approve Android SDK & NDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # Injecting verification keys directly to the current workspace environment variables
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n8933bad161ad4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb7431302ba76463b978\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a54c5f35e431dbaf43e728d228a" > $ANDROID_HOME/licenses/android-sdk-preview-license
          
          # Injecting mirror signatures to the fallback local compilation architecture directory
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n8933bad161ad4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb7431302ba76463b978\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a54c5f35e431dbaf43e728d228a" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Execute Native Android Architecture Compilation
        run: |
          buildozer android debug

      - name: Export Master Production APK Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-production-binary
          path: bin/*.apk
          if-no-files-found: error
